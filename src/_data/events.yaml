# Every gathering, past and future, in one list.
# Upcoming ones appear on the Events page; once the date passes they move
# to the Archive automatically.
#
# Fields (only date is required):
#   date:       2026-10-26            (YYYY-MM-DD)
#   time:       6–8 pm
#   title:      only for a special session (e.g. Text + Pix × Manchester);
#               ordinary gatherings need no title
#   presenters: list of names, each with an optional short note
#   location:   leave out to use the default venue in site.yaml
#   about:      a sentence or two for the listing
#   rsvp:       link to a sign-up form (Google Form, Brevo, etc.)
#   rsvp_label: button text, if not "Reserve a seat"
#   image:      file in src/assets/img/, e.g. 2026-10-dilworth.jpg
#   image_alt:  a plain description of that image
#   recap:      after the event, a few sentences for the archive

- date: 2026-10-26
  time: 6–8 pm
  presenters:
    - name: Alexa Dilworth
  about: >-
    Alexa Dilworth presents “Time Signatures,” a natural philosophy for the
    “documentary” photograph. This contemplation of sustainable alternative
    processes (the garden darkroom) explores new modes for understanding how
    images live in time. The premise is to imagine photographs, conceived as
    analog prints on any surface, as having an existence outside of their
    relationship to representation, reproduction, and (re)collection, to
    “thingness.”
  rsvp: /oct26
  rsvp_label: Register

- date: 2026-11-04
  time: 12:30–2 pm Eastern (5:30–7 pm UK)
  title: Text + Pix × Manchester
  presenters:
    - name: Kelechi Anucha
      note: University of Manchester
    - name: Siân Macfarlane
      note: Manchester Metropolitan University
  location: >-
    On Zoom, and in person in the CDS Conference Room (Room L203),
    1317 W. Pettigrew St., Durham, NC
  about: >-
    A joint session with colleagues in Manchester, UK, hosted by Frances
    Leviston. Kelechi Anucha is a literary and medical humanities scholar who
    directs the MA in Arts, Culture and the Environment at the University of
    Manchester; her research has looked at time, care and the body in
    contemporary writing and film. Siân Macfarlane is an artist and Senior
    Lecturer in Photography at Manchester Metropolitan University, working
    across historic darkroom processes, film, performance and installation,
    often reading post-industrial landscapes through literature and folklore.
    Each brings something from her current work, and the room takes it from
    there.
  rsvp: /nov4
  rsvp_label: Register (Zoom or in person)

