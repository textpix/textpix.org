# Site-wide settings. Leave a value blank ("") to hide that item on the site.

name: Text + Pix Collective
url: https://textpix.org
description: >-
  A Durham collective of writers, photographers, artists, designers and
  scholars who meet monthly to share work on the meeting of words and images.

email: hello@textpix.org

# Default meeting place, used when an event doesn't name its own.
venue:
  name: CDS Library, Center for Documentary Studies
  address: 1317 W. Pettigrew St., Durham, NC

# Mailing list (Brevo). Fill in whichever you have; leave the rest blank.
#   form_action: the "action" address from the HTML of your Brevo sign-up
#                form (starts with https://...sibforms.com/serve/). Shows the
#                site's own styled form.
#   form_link:   the shareable link to the Brevo-hosted form. Used if
#                form_action is blank, as a "Join the mailing list" button.
# With both blank, the button opens an email to the address above.
brevo:
  form_action: ""
  form_link: ""

social:
  instagram: ""   # e.g. https://www.instagram.com/textpixcollective
  bluesky: ""     # e.g. https://bsky.app/profile/textpix.org

organizers:
  - name: Mort O'Sullivan
  - name: Dennis Szerszen
  - name: Laura Williams

founders: Lauren Neefe (MFA in Experimental and Documentary Arts) and Mesha Maren-Hogan (English)
founded: Fall 2024
